<div class="app-container">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header>
    <div class="header-content">
      <h1>QR Utility</h1>

      <button class="hamburger" (click)="toggleMobileMenu()" [class.open]="mobileMenuOpen" [attr.aria-expanded]="mobileMenuOpen" aria-label="Toggle navigation menu">
        <span></span><span></span><span></span>
      </button>

      <nav [class.mobile-open]="mobileMenuOpen" aria-label="Main navigation">
        <ul>
          <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()">Home</a></li>
          <li><a routerLink="/generate" routerLinkActive="active" (click)="closeMobileMenu()">Generate QR</a></li>
          <li><a routerLink="/batch" routerLinkActive="active" (click)="closeMobileMenu()">Batch</a></li>
          <li><a routerLink="/barcode/generate" routerLinkActive="active" (click)="closeMobileMenu()">Barcode</a></li>
          <li><a routerLink="/scan" routerLinkActive="active" (click)="closeMobileMenu()">Scan</a></li>
          <li><a routerLink="/history" routerLinkActive="active" (click)="closeMobileMenu()">History</a></li>
        </ul>
      </nav>

      <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'">
        @if (darkMode) {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        }
      </button>
    </div>
  </header>

  <main id="main-content">
    <router-outlet></router-outlet>
  </main>

  <footer>
    <p>
      &copy; {{ currentYear }} QR Utility. Built with Angular. | 
      <a href="https://whatley.xyz/playground" target="_blank" rel="noopener noreferrer">Whatley's Playground</a>
    </p>
  </footer>
</div>
